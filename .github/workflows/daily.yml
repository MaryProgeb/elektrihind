name: daily-cheapest-slots

on:
  schedule:
    # 08:07 Europe/Tallinn: a few minutes off the hour to avoid the busiest queue time.
    - cron: "7 8 * * *"
      timezone: "Europe/Tallinn"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Send today's remaining cheapest slots
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m elektrihind
